name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Missing test ROMs fail the build instead of silently skipping tests.
  GAMEVAULT_REQUIRE_TEST_ROMS: 1

jobs:
  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        id: setup-dotnet
        continue-on-error: true
        with:
          global-json-file: global.json

      # setup-dotnet resolves through aka.ms to a storage host that has started answering 409. When that
      # happens, install the newest .NET 10 SDK straight from builds.dotnet.microsoft.com instead.
      - name: Install .NET from builds.dotnet.microsoft.com (fallback)
        if: steps.setup-dotnet.outcome == 'failure'
        shell: pwsh
        run: |
          $feed = 'https://builds.dotnet.microsoft.com/dotnet'
          $version = ((Invoke-WebRequest "$feed/Sdk/10.0/latest.version").Content -split "`n" | Where-Object { $_.Trim() } | Select-Object -Last 1).Trim()
          Invoke-WebRequest 'https://dot.net/v1/dotnet-install.ps1' -OutFile dotnet-install.ps1
          $dir = Join-Path $env:RUNNER_TEMP 'dotnet'
          ./dotnet-install.ps1 -Version $version -AzureFeed $feed -InstallDir $dir
          $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "DOTNET_ROOT=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DOTNET_MULTILEVEL_LOOKUP=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Fetch test ROMs
        shell: pwsh
        run: ./tests/TestRoms/fetch-test-roms.ps1

      - name: Restore
        run: dotnet restore GameVault.sln

      - name: Build
        run: dotnet build GameVault.sln -c Debug --no-restore

      - name: Test
        run: dotnet test GameVault.sln -c Debug --no-build --logger trx --results-directory TestResults

      - name: Smoke test (app launches in real mode and every screen renders under --sample-data)
        shell: pwsh
        run: |
          $exe = Get-ChildItem src/GameVault.App/bin -Recurse -Filter GameVault.exe | Select-Object -First 1
          if (-not $exe) { throw "GameVault.exe was not built." }
          $crashLog = Join-Path $env:LOCALAPPDATA 'GameVault\logs\crash.log'
          $launches = @('', '--sample-data', '--sample-data --page=player', '--sample-data --page=gamedetails',
                        '--sample-data --page=catalogimport', '--sample-data --page=settings', '--sample-data --page=dumpcartridge',
                        '--sample-data=empty')
          foreach ($launch in $launches) {
            Write-Host "Launching $($exe.FullName) $launch"
            # An empty argument list means a real launch: real library database, devices and settings.
            $p = if ($launch) { Start-Process $exe.FullName -ArgumentList $launch -PassThru } else { Start-Process $exe.FullName -PassThru }
            Start-Sleep -Seconds 15
            if ($p.HasExited) {
              if (Test-Path $crashLog) { Write-Host '--- crash.log ---'; Get-Content $crashLog }
              Write-Host '--- Application event log (errors) ---'
              Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Level = 2; StartTime = (Get-Date).AddMinutes(-5) } -ErrorAction SilentlyContinue |
                Select-Object -First 5 | Format-List TimeCreated, ProviderName, Message
              throw ("GameVault ($launch) exited early with code 0x{0:X8}." -f $p.ExitCode)
            }
            Stop-Process -Id $p.Id -Force
            Write-Host "GameVault ($launch) stayed running for 15 seconds."
          }
          if (Test-Path $crashLog) { Write-Host '--- crash.log (handled exceptions) ---'; Get-Content $crashLog; throw "Exceptions were logged." }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-windows
          path: TestResults

  cross-platform:
    name: Core, Library and ViewModels (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        id: setup-dotnet
        continue-on-error: true
        with:
          global-json-file: global.json

      # See the Windows job: fall back to builds.dotnet.microsoft.com when setup-dotnet's download fails.
      - name: Install .NET from builds.dotnet.microsoft.com (fallback)
        if: steps.setup-dotnet.outcome == 'failure'
        run: |
          feed=https://builds.dotnet.microsoft.com/dotnet
          version=$(curl -fsSL "$feed/Sdk/10.0/latest.version" | tr -d '\r' | sed '/^$/d' | tail -1)
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          dir="$RUNNER_TEMP/dotnet"
          bash dotnet-install.sh --version "$version" --azure-feed "$feed" --install-dir "$dir"
          echo "$dir" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$dir" >> "$GITHUB_ENV"

      - name: Fetch test ROMs
        run: ./tests/TestRoms/fetch-test-roms.sh

      - name: Build and test
        run: dotnet test GameVault.CrossPlatform.slnf -c Debug
