name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Missing test ROMs fail the build instead of silently skipping tests.
  GAMEVAULT_REQUIRE_TEST_ROMS: 1

jobs:
  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        id: setup-dotnet
        continue-on-error: true
        with:
          global-json-file: global.json

      # setup-dotnet resolves through aka.ms to a storage host that has started answering 409. When that
      # happens, install the newest .NET 10 SDK straight from builds.dotnet.microsoft.com instead.
      - name: Install .NET from builds.dotnet.microsoft.com (fallback)
        if: steps.setup-dotnet.outcome == 'failure'
        shell: pwsh
        run: |
          $feed = 'https://builds.dotnet.microsoft.com/dotnet'
          $version = ((Invoke-WebRequest "$feed/Sdk/10.0/latest.version").Content -split "`n" | Where-Object { $_.Trim() } | Select-Object -Last 1).Trim()
          Invoke-WebRequest 'https://dot.net/v1/dotnet-install.ps1' -OutFile dotnet-install.ps1
          $dir = Join-Path $env:RUNNER_TEMP 'dotnet'
          ./dotnet-install.ps1 -Version $version -AzureFeed $feed -InstallDir $dir
          $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "DOTNET_ROOT=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DOTNET_MULTILEVEL_LOOKUP=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Fetch test ROMs
        shell: pwsh
        run: ./tests/TestRoms/fetch-test-roms.ps1

      - name: Restore
        run: dotnet restore GameVault.sln

      - name: Build
        run: dotnet build GameVault.sln -c Debug --no-restore

      - name: Test
        # One test project at a time (-m:1): the Core tests' PS2 programs keep every core busy for minutes, which starved
        # the Platform tests that wait on the real-time frame loop (netplay, zero-config start, challenges).
        run: dotnet test GameVault.sln -c Debug --no-build -m:1 --logger trx --results-directory TestResults

      - name: Smoke test (app launches in real mode and every screen renders under --sample-data)
        shell: pwsh
        run: |
          $exe = Get-ChildItem src/GameVault.App/bin -Recurse -Filter GameVault.exe | Select-Object -First 1
          if (-not $exe) { throw "GameVault.exe was not built." }
          $crashLog = Join-Path $env:LOCALAPPDATA 'GameVault\logs\crash.log'
          $launches = @('', '--sample-data', '--sample-data --page=player', '--sample-data --page=gamedetails',
                        '--sample-data --page=catalogimport', '--sample-data --page=settings', '--sample-data --page=dumpcartridge',
                        '--sample-data=empty')
          foreach ($launch in $launches) {
            Write-Host "Launching $($exe.FullName) $launch"
            # An empty argument list means a real launch: real library database, devices and settings.
            $p = if ($launch) { Start-Process $exe.FullName -ArgumentList $launch -PassThru } else { Start-Process $exe.FullName -PassThru }
            Start-Sleep -Seconds 15
            if ($p.HasExited) {
              if (Test-Path $crashLog) { Write-Host '--- crash.log ---'; Get-Content $crashLog }
              Write-Host '--- Application event log (errors) ---'
              Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Level = 2; StartTime = (Get-Date).AddMinutes(-5) } -ErrorAction SilentlyContinue |
                Select-Object -First 5 | Format-List TimeCreated, ProviderName, Message
              throw ("GameVault ($launch) exited early with code 0x{0:X8}." -f $p.ExitCode)
            }
            Stop-Process -Id $p.Id -Force
            Write-Host "GameVault ($launch) stayed running for 15 seconds."
          }
          if (Test-Path $crashLog) { Write-Host '--- crash.log (handled exceptions) ---'; Get-Content $crashLog; throw "Exceptions were logged." }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-windows
          path: TestResults

  cross-platform:
    name: Core, Library and ViewModels (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        id: setup-dotnet
        continue-on-error: true
        with:
          global-json-file: global.json

      # See the Windows job: fall back to builds.dotnet.microsoft.com when setup-dotnet's download fails.
      - name: Install .NET from builds.dotnet.microsoft.com (fallback)
        if: steps.setup-dotnet.outcome == 'failure'
        run: |
          feed=https://builds.dotnet.microsoft.com/dotnet
          version=$(curl -fsSL "$feed/Sdk/10.0/latest.version" | tr -d '\r' | sed '/^$/d' | tail -1)
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          dir="$RUNNER_TEMP/dotnet"
          bash dotnet-install.sh --version "$version" --azure-feed "$feed" --install-dir "$dir"
          echo "$dir" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$dir" >> "$GITHUB_ENV"

      - name: Fetch test ROMs
        run: ./tests/TestRoms/fetch-test-roms.sh

      # Mesa's lavapipe: a software Vulkan device, so the N64 RDP's GPU kernel runs in the Platform tests.
      - name: Install a software Vulkan device
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1

      - name: Build and test
        run: dotnet test GameVault.CrossPlatform.slnf -c Debug

  z80-exerciser:
    name: Z80 exerciser (zexdoc, zexall; Linux, Release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        id: setup-dotnet
        continue-on-error: true
        with:
          global-json-file: global.json

      # See the Windows job: fall back to builds.dotnet.microsoft.com when setup-dotnet's download fails.
      - name: Install .NET from builds.dotnet.microsoft.com (fallback)
        if: steps.setup-dotnet.outcome == 'failure'
        run: |
          feed=https://builds.dotnet.microsoft.com/dotnet
          version=$(curl -fsSL "$feed/Sdk/10.0/latest.version" | tr -d '\r' | sed '/^$/d' | tail -1)
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          dir="$RUNNER_TEMP/dotnet"
          bash dotnet-install.sh --version "$version" --azure-feed "$feed" --install-dir "$dir"
          echo "$dir" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$dir" >> "$GITHUB_ENV"

      - name: Fetch test ROMs
        run: ./tests/TestRoms/fetch-test-roms.sh

      # Each exerciser runs about 5.8 billion instructions (under 2 minutes in Release), so they have their own job.
      - name: Run zexdoc and zexall
        env:
          GAMEVAULT_RUN_ZEX: 1
        run: dotnet test tests/GameVault.Core.Tests -c Release --filter "FullyQualifiedName~Zex_exercises" --logger "console;verbosity=detailed"

  m68000-tests:
    name: 68000 single-step tests (Linux, Release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        id: setup-dotnet
        continue-on-error: true
        with:
          global-json-file: global.json

      # See the Windows job: fall back to builds.dotnet.microsoft.com when setup-dotnet's download fails.
      - name: Install .NET from builds.dotnet.microsoft.com (fallback)
        if: steps.setup-dotnet.outcome == 'failure'
        run: |
          feed=https://builds.dotnet.microsoft.com/dotnet
          version=$(curl -fsSL "$feed/Sdk/10.0/latest.version" | tr -d '\r' | sed '/^$/d' | tail -1)
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          dir="$RUNNER_TEMP/dotnet"
          bash dotnet-install.sh --version "$version" --azure-feed "$feed" --install-dir "$dir"
          echo "$dir" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$dir" >> "$GITHUB_ENV"

      - name: Fetch the 68000 tests
        run: ./tests/TestRoms/fetch-test-roms.sh manifest-680x0.tsv

      # About a million tests (124 files of 8,065), each one instruction from a stated state; under a minute in Release.
      - name: Run the SingleStepTests 680x0 suite
        env:
          GAMEVAULT_RUN_68K: 1
        run: dotnet test tests/GameVault.Core.Tests -c Release --filter "FullyQualifiedName~SingleStepTests" --logger "console;verbosity=detailed"

  snes-cpu-tests:
    name: 65816 and SPC700 single-step tests (Linux, Release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        id: setup-dotnet
        continue-on-error: true
        with:
          global-json-file: global.json

      # See the Windows job: fall back to builds.dotnet.microsoft.com when setup-dotnet's download fails.
      - name: Install .NET from builds.dotnet.microsoft.com (fallback)
        if: steps.setup-dotnet.outcome == 'failure'
        run: |
          feed=https://builds.dotnet.microsoft.com/dotnet
          version=$(curl -fsSL "$feed/Sdk/10.0/latest.version" | tr -d '\r' | sed '/^$/d' | tail -1)
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          dir="$RUNNER_TEMP/dotnet"
          bash dotnet-install.sh --version "$version" --azure-feed "$feed" --install-dir "$dir"
          echo "$dir" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$dir" >> "$GITHUB_ENV"

      # The 65816 suite is about 2.6 GB of JSON; keep it between runs.
      - name: Cache the 65816 tests
        uses: actions/cache@v4
        with:
          path: tests/TestRoms/.cache/65816
          key: singlestep-65816-${{ hashFiles('tests/TestRoms/manifest-65816.tsv') }}

      - name: Fetch the 65816 and SPC700 tests
        run: |
          ./tests/TestRoms/fetch-test-roms.sh manifest-65816.tsv
          ./tests/TestRoms/fetch-test-roms.sh manifest-spc700.tsv

      # About 5 million 65816 tests (native and emulation mode) and 256,000 SPC700 tests, each one instruction.
      - name: Run the SingleStepTests 65816 and spc700 suites
        env:
          GAMEVAULT_RUN_65816: 1
          GAMEVAULT_RUN_SPC700: 1
        run: dotnet test tests/GameVault.Core.Tests -c Release --filter "FullyQualifiedName~W65816SingleStepTests|FullyQualifiedName~Spc700SingleStepTests" --logger "console;verbosity=detailed"

  n64-tests:
    name: Nintendo 64 test programs (Linux, Release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        id: setup-dotnet
        continue-on-error: true
        with:
          global-json-file: global.json

      # See the Windows job: fall back to builds.dotnet.microsoft.com when setup-dotnet's download fails.
      - name: Install .NET from builds.dotnet.microsoft.com (fallback)
        if: steps.setup-dotnet.outcome == 'failure'
        run: |
          feed=https://builds.dotnet.microsoft.com/dotnet
          version=$(curl -fsSL "$feed/Sdk/10.0/latest.version" | tr -d '\r' | sed '/^$/d' | tail -1)
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          dir="$RUNNER_TEMP/dotnet"
          bash dotnet-install.sh --version "$version" --azure-feed "$feed" --install-dir "$dir"
          echo "$dir" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$dir" >> "$GITHUB_ENV"

      # PeterLemon's N64 programs are 1 MB ROMs, about 270 MB in all; keep them between runs.
      - name: Cache the N64 test programs
        uses: actions/cache@v4
        with:
          path: tests/TestRoms/.cache/n64-peterlemon
          key: n64-peterlemon-${{ hashFiles('tests/TestRoms/manifest-n64.tsv') }}

      - name: Fetch the N64 test programs
        run: ./tests/TestRoms/fetch-test-roms.sh manifest-n64.tsv

      # The CPU, FPU, RSP and DMA programs (PASS/FAIL) and the RDP programs (references and golden images).
      - name: Run PeterLemon's N64 programs
        env:
          GAMEVAULT_RUN_N64: 1
        run: dotnet test tests/GameVault.Core.Tests -c Release --filter "FullyQualifiedName~PeterLemonN64" --logger "console;verbosity=detailed"
